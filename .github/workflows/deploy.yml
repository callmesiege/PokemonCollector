name: Deploy to GitHub Pages

# Manual only. The simplest way to publish is Settings → Pages → "Deploy from a branch",
# which needs no workflow. Run this by hand if you prefer the GitHub Actions source instead.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp service-worker version with the commit SHA
        run: sed -i "s/^const VERSION = .*/const VERSION = 'v-${GITHUB_SHA::8}';/" sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
